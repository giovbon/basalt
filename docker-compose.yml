services:
  basalt:
    # Para usar a imagem publicada no Docker Hub:
    # image: giovbon/basalt:latest
    # Ou para compilar localmente:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basalt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NOTES_DIR=/app/data
      # Cache do índice (gob) dentro do volume montado: o boot volta quente
      # após restarts do container. O arquivo é um cache descartável.
      - INDEX_FILE=/app/data/.basalt-index.gob
      - APP_NAME=Basalt
      - DEFAULT_THEME=light
      # Monitoramento opcional de um tópico ntfy:
      # - NTFY_ENABLED=true
      # - NTFY_SERVER_URL=https://ntfy.sh
      # - NTFY_TOPIC=meu-topico
      # - NTFY_USERNAME=seu_usuario
      # - NTFY_PASSWORD=sua_senha
      # - NTFY_CAPTURE_DIR=Captura
      # Autenticação opcional:
      # - AUTHENTICATION_ENABLED=true
      # - AUTHENTICATION_PASSWORD=sua_senha_segura
      # - AUTHENTICATION_SECRET_KEY=gere_uma_chave_aleatoria_aqui
      # - AUTHENTICATION_API_KEY=sua_api_key_opcional
    volumes:
      # Persistência das suas notas e mídias no host:
      - ./data:/app/data
      # Opcional: montar config.yaml personalizado se desejar
      # - ./config.yaml:/app/config.yaml:ro
