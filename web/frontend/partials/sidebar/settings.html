                <!-- ==================== SETTINGS PANEL ==================== -->
                <template x-if="activePanel === 'settings'">
                    <div class="flex flex-col h-full" x-data="settingsPanel">
                        <!-- Settings Header -->
                        <div class="flex-shrink-0 px-3 py-2 border-b" style="border-color: var(--border-primary);">
                            <span class="text-xs font-semibold uppercase tracking-wide" style="color: var(--text-tertiary);" x-text="t('sidebar.settings_title')"></span>
                        </div>
                        
                        <!-- Scrollable content -->
                        <div class="flex-1 overflow-y-auto custom-scrollbar">
                            <div class="p-3">
                                <!-- Theme -->
                                <div class="mb-4">
                                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);" x-text="t('theme.title')">Theme</label>
                                    <select 
                                        data-testid="theme-select"
                                        x-model="currentTheme"
                                        @change="setTheme(currentTheme)"
                                        class="w-full px-2 py-2 text-sm rounded focus:outline-none focus:ring-2 focus:ring-opacity-50"
                                        style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary); cursor: pointer;"
                                    >
                                        <template x-for="theme in availableThemes" :key="theme.id">
                                            <option :value="theme.id" :selected="theme.id === currentTheme" x-text="theme.name"></option>
                                        </template>
                                    </select>
                                </div>
                                
                                <!-- Language (only shown if multiple locales are available) -->
                                <div class="mb-4" x-show="availableLocales && availableLocales.length > 1">
                                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);" x-text="t('language.title')">Language</label>
                                    <select 
                                        x-model="currentLocale"
                                        @change="changeLocale(currentLocale)"
                                        class="w-full px-2 py-2 text-sm rounded focus:outline-none focus:ring-2 focus:ring-opacity-50"
                                        style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary); cursor: pointer;"
                                    >
                                        <template x-for="loc in availableLocales" :key="loc.code">
                                            <option :value="loc.code" :selected="loc.code === currentLocale" x-text="loc.flag + ' ' + loc.name"></option>
                                        </template>
                                    </select>
                                </div>
                                
                                <!-- TODO keywords -->
                                <div class="mb-4">
                                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);" for="todo-keywords" x-text="t('todos.keywords_label')"></label>
                                    <input
                                        id="todo-keywords"
                                        data-testid="todo-keywords-input"
                                        type="text"
                                        x-model="todoKeywords"
                                        @change="saveTodoKeywords()"
                                        :disabled="todoKeywordsSaving"
                                        :placeholder="t('todos.keywords_placeholder')"
                                        class="w-full px-2 py-2 text-sm rounded focus:outline-none focus:ring-2 focus:ring-opacity-50"
                                        style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);"
                                    >
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('todos.keywords_description')"></p>
                                </div>

                                <!-- Syntax Highlighting Toggle -->
                                <div class="mb-4">
                                    <label class="flex items-center justify-between gap-3 cursor-pointer">
                                        <span class="text-xs font-medium flex-1 min-w-0" style="color: var(--text-secondary);" x-text="t('syntax_highlight.title')"></span>
                                        <div 
                                            @click="toggleSyntaxHighlight()"
                                            class="relative w-10 h-5 rounded-full transition-colors cursor-pointer flex-shrink-0"
                                            :style="syntaxHighlightEnabled ? 'background-color: var(--accent-primary)' : 'background-color: var(--bg-tertiary)'"
                                        >
                                            <div 
                                                class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform"
                                                :style="'background-color: var(--bg-primary);' + (syntaxHighlightEnabled ? ' transform: translateX(20px);' : '')"
                                            ></div>
                                        </div>
                                    </label>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('syntax_highlight.description')"></p>
                                </div>
                                
                                <!-- Readable Line Length Toggle -->
                                <div class="mb-4">
                                    <label class="flex items-center justify-between gap-3 cursor-pointer">
                                        <span class="text-xs font-medium flex-1 min-w-0" style="color: var(--text-secondary);" x-text="t('settings.readable_line_length')"></span>
                                        <div 
                                            @click="toggleReadableLineLength()"
                                            class="relative w-10 h-5 rounded-full transition-colors cursor-pointer flex-shrink-0"
                                            :style="readableLineLength ? 'background-color: var(--accent-primary)' : 'background-color: var(--bg-tertiary)'"
                                        >
                                            <div 
                                                class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform"
                                                :style="'background-color: var(--bg-primary);' + (readableLineLength ? ' transform: translateX(20px);' : '')"
                                            ></div>
                                        </div>
                                    </label>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('settings.readable_line_length_desc')"></p>
                                </div>
                                
                                <!-- Hide Underscore Folders Toggle -->
                                <div class="mb-4">
                                    <label class="flex items-center justify-between gap-3 cursor-pointer">
                                        <span class="text-xs font-medium flex-1 min-w-0" style="color: var(--text-secondary);" x-text="t('settings.hide_underscore_folders')"></span>
                                        <div 
                                            @click="toggleHideUnderscoreFolders()"
                                            class="relative w-10 h-5 rounded-full transition-colors cursor-pointer flex-shrink-0"
                                            :style="hideUnderscoreFolders ? 'background-color: var(--accent-primary)' : 'background-color: var(--bg-tertiary)'"
                                        >
                                            <div 
                                                class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform"
                                                :style="'background-color: var(--bg-primary);' + (hideUnderscoreFolders ? ' transform: translateX(20px);' : '')"
                                            ></div>
                                        </div>
                                    </label>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('settings.hide_underscore_folders_desc')"></p>
                                </div>

                                <!-- Tab inserts tab -->
                                <div class="mb-4">
                                    <label class="flex items-center justify-between gap-3 cursor-pointer">
                                        <span class="text-xs font-medium flex-1 min-w-0" style="color: var(--text-secondary);" x-text="t('settings.tab_inserts_tab')"></span>
                                        <div 
                                            @click="toggleTabInsertsTab()"
                                            class="relative w-10 h-5 rounded-full transition-colors cursor-pointer flex-shrink-0"
                                            :style="tabInsertsTab ? 'background-color: var(--accent-primary)' : 'background-color: var(--bg-tertiary)'"
                                        >
                                            <div 
                                                class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform"
                                                :style="'background-color: var(--bg-primary);' + (tabInsertsTab ? ' transform: translateX(20px);' : '')"
                                            ></div>
                                        </div>
                                    </label>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('settings.tab_inserts_tab_desc')"></p>
                                </div>

                                <div class="mb-4">
                                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);" x-text="t('settings.new_button_action')"></label>
                                    <select
                                        x-model="newButtonAction"
                                        @change="persistNewButtonAction()"
                                        class="w-full px-3 py-2 rounded border text-sm"
                                        style="background-color: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-primary);"
                                    >
                                        <option value="chooser"  x-text="t('settings.new_button_option_chooser')"></option>
                                        <option value="note"     x-text="t('settings.new_button_option_note')"></option>
                                        <option value="folder"   x-text="t('settings.new_button_option_folder')"></option>
                                    </select>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('settings.new_button_action_desc')"></p>
                                </div>

                                <div class="mb-4">
                                    <label class="flex items-center justify-between gap-3 cursor-pointer">
                                        <span class="text-xs font-medium flex-1 min-w-0" style="color: var(--text-secondary);" x-text="t('settings.auto_fill_note_title')"></span>
                                        <div
                                            @click="toggleAutoFillNoteTitle()"
                                            class="relative w-10 h-5 rounded-full transition-colors cursor-pointer flex-shrink-0"
                                            :style="autoFillNoteTitle ? 'background-color: var(--accent-primary)' : 'background-color: var(--bg-tertiary)'"
                                        >
                                            <div
                                                class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full transition-transform"
                                                :style="'background-color: var(--bg-primary);' + (autoFillNoteTitle ? ' transform: translateX(20px);' : '')"
                                            ></div>
                                        </div>
                                    </label>
                                    <p class="text-xs mt-1" style="color: var(--text-tertiary);" x-text="t('settings.auto_fill_note_title_desc')"></p>
                                </div>

                                <!-- ntfy inbox -->
                                <form class="mb-4 border-t pt-4" style="border-color: var(--border-primary);" @submit.prevent="saveNtfyConfig()">
                                    <h3 class="text-xs font-semibold uppercase tracking-wide mb-2" style="color: var(--text-secondary);" x-text="t('settings.ntfy_title')"></h3>
                                    <p class="text-xs mb-3" style="color: var(--text-tertiary);" x-text="t('settings.ntfy_description')"></p>

                                    <label class="flex items-center gap-2 mb-3 text-xs" style="color: var(--text-secondary);">
                                        <input type="checkbox" x-model="ntfyConfig.enabled">
                                        <span x-text="t('settings.ntfy_enabled')"></span>
                                    </label>

                                    <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);" for="ntfy-server-url" x-text="t('settings.ntfy_server')"></label>
                                    <input id="ntfy-server-url" type="url" required x-model="ntfyConfig.serverUrl" class="w-full px-2 py-2 mb-3 text-sm rounded" style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);">

                                    <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);" for="ntfy-topic" x-text="t('settings.ntfy_topic')"></label>
                                    <input id="ntfy-topic" type="text" x-model="ntfyConfig.topic" :required="ntfyConfig.enabled" class="w-full px-2 py-2 mb-3 text-sm rounded" style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);">

                                    <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);" for="ntfy-username" x-text="t('settings.ntfy_username')"></label>
                                    <input id="ntfy-username" type="text" autocomplete="username" x-model="ntfyConfig.username" class="w-full px-2 py-2 mb-3 text-sm rounded" style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);">

                                    <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);" for="ntfy-password" x-text="t('settings.ntfy_password')"></label>
                                    <input id="ntfy-password" type="password" autocomplete="new-password" x-model="ntfyConfig.password" @input="ntfyConfig.clearPassword = false" class="w-full px-2 py-2 mb-1 text-sm rounded" style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);" :placeholder="ntfyConfig.passwordConfigured ? t('settings.ntfy_password_saved') : t('settings.ntfy_password_optional')">
                                    <label x-show="ntfyConfig.passwordConfigured" class="flex items-center gap-2 mb-3 mt-2 text-xs" style="color: var(--text-secondary);">
                                        <input type="checkbox" x-model="ntfyConfig.clearPassword">
                                        <span x-text="t('settings.ntfy_clear_password')"></span>
                                    </label>

                                    <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);" for="ntfy-capture-dir" x-text="t('settings.ntfy_capture_dir')"></label>
                                    <input id="ntfy-capture-dir" type="text" required x-model="ntfyConfig.captureDir" class="w-full px-2 py-2 mb-3 text-sm rounded" style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);">

                                    <button type="submit" :disabled="ntfyConfig.saving" class="w-full px-3 py-2 text-sm rounded transition-colors disabled:opacity-50" style="background-color: var(--accent-primary); color: var(--bg-primary);">
                                        <span x-text="ntfyConfig.saving ? t('settings.ntfy_saving') : t('settings.ntfy_save')"></span>
                                    </button>
                                </form>
                                
                                <!-- Logout (if auth enabled) - uses authEnabled from main app state -->
                                <div x-show="authEnabled" class="mb-4">
                                    <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);" x-text="t('settings.account')"></label>
                                    <form method="POST" action="/logout">
                                        <button
                                            type="submit"
                                            class="w-full flex items-center justify-center gap-2 px-3 py-2 text-sm rounded transition-colors cursor-pointer"
                                            style="background-color: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-primary);"
                                            onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                                            onmouseout="this.style.backgroundColor='var(--bg-primary)'"
                                        >
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17l5-5-5-5M21 12H9"></path>
                                            </svg>
                                            <span x-text="t('settings.logout')"></span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                            
                    </div>
                </template>
                <!-- END SETTINGS PANEL -->
