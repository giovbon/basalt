                <!-- ==================== FILES PANEL ==================== -->
                <div x-data="filesPanel" x-show="activePanel === 'files'" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="flex flex-col h-full">
                    <!-- Header with + New -->
                    <div class="flex-shrink-0 px-2 py-2 border-b flex items-center justify-between gap-2" style="border-color: var(--border-primary);">
                        <span class="text-xs font-semibold uppercase tracking-wide" style="color: var(--text-tertiary);" x-text="t('sidebar.files')"></span>
                        <div class="flex items-center gap-1">
                <!-- Upload files (PDF, images, …) — works with no note open -->
                <button
                    data-testid="upload-button"
                    @click="$refs.globalFileInput.click()"
                            :title="t('media.upload_button')"
                            :aria-label="t('media.upload_button')"
                            class="px-2 py-1 text-xs font-medium rounded focus:outline-none flex items-center gap-1"
                            style="color: var(--text-primary); border: 1px solid var(--border-primary); background-color: var(--bg-secondary);"
                            onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                            onmouseout="this.style.backgroundColor='var(--bg-secondary)'"
                >
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            <span class="hidden xl:inline" x-text="t('media.upload_button')"></span>
                </button>
                <button 
                    data-testid="new-button"
                    @click="dropdownTargetFolder = ''; toggleNewDropdown($event)"
                            class="px-2 py-1 text-xs font-medium text-white rounded focus:outline-none flex items-center gap-1"
                    style="background-color: var(--accent-primary);"
                    onmouseover="this.style.backgroundColor='var(--accent-hover)'"
                    onmouseout="this.style.backgroundColor='var(--accent-primary)'"
                >
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                            New
                </button>
                        </div>
            </div>
            
                    <!-- Folder Tree -->
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-2">
                        
                        <!-- Favorites Section -->
                        <div x-show="favoriteNotes.length > 0" class="mb-2">
                            <div 
                                @click="favoritesExpanded = !favoritesExpanded"
                                class="flex items-center justify-between px-2 py-1 cursor-pointer rounded hover:bg-opacity-50 transition-colors"
                                style="color: var(--text-tertiary);"
                                @mouseenter="$el.style.backgroundColor = 'var(--bg-hover)'"
                                @mouseleave="$el.style.backgroundColor = 'transparent'"
                            >
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-semibold uppercase tracking-wide" x-text="t('sidebar.favorites_title')"></span>
                                </div>
                                <svg 
                                    class="w-3 h-3 transition-transform" 
                                    :class="{'rotate-90': favoritesExpanded}"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                >
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                            <div x-show="favoritesExpanded" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="mt-1">
                                <template x-for="fav in favoriteNotes" :key="fav.path">
                                    <div 
                                        @click="loadNote(fav.path)"
                                        class="hover-accent flex items-center justify-between px-2 py-1 group"
                                        :class="{'active': currentNote === fav.path}"
                                        :style="currentNote === fav.path ? 'background-color: var(--accent-primary); color: white;' : 'color: var(--text-secondary);'"
                                        :title="fav.path"
                                    >
                                        <div class="flex items-center gap-1.5 min-w-0 flex-1">
                                            <svg class="w-3.5 h-3.5 flex-shrink-0" style="color: var(--warning, #eab308);" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                                            </svg>
                                            <span class="text-xs truncate" x-text="fav.name"></span>
                                        </div>
                                        <button 
                                            @click.stop="toggleFavorite(fav.path)"
                                            class="opacity-0 group-hover:opacity-100 p-0.5 rounded transition-opacity"
                                            :title="t('toolbar.remove_favorite')"
                                            @mouseenter="$el.style.backgroundColor = 'var(--bg-secondary)'"
                                            @mouseleave="$el.style.backgroundColor = 'transparent'"
                                        >
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                        
                        <div class="text-xs px-2 py-0.5 mb-1.5" style="color: var(--text-tertiary);">
                            <div class="flex items-center justify-between mb-0.5">
                                <span x-text="t('sidebar.folders_and_notes')"></span>
                                <div class="flex gap-0.5">
                                    <button
                                        data-testid="tree-selection-toggle"
                                        @click="toggleTreeSelectionMode()"
                                        class="text-xs px-1.5 py-0.5 rounded transition-all hover:scale-110"
                                        :title="t(treeSelectionMode ? 'sidebar.cancel_selection' : 'sidebar.select_items')"
                                        :aria-label="t(treeSelectionMode ? 'sidebar.cancel_selection' : 'sidebar.select_items')"
                                        style="opacity: 0.7;"
                                        onmouseover="this.style.opacity='1'"
                                        onmouseout="this.style.opacity='0.7'"
                                    >
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
                                        </svg>
                                    </button>
                                    <button
                                        @click="cycleSortMode()"
                                        class="text-xs px-1.5 py-0.5 rounded transition-all hover:scale-110"
                                        :title="t('sidebar.sort_' + sortMode)"
                                        style="opacity: 0.7;"
                                        onmouseover="this.style.opacity='1'"
                                        onmouseout="this.style.opacity='0.7'"
                                    ><span x-html="getSortIcon()"></span></button>
                                    <button
                                        @click="expandAllFolders()"
                                        class="text-xs px-1.5 py-0.5 rounded transition-all hover:scale-110"
                                        :title="t('sidebar.expand_all')"
                                        style="opacity: 0.7;"
                                        onmouseover="this.style.opacity='1'"
                                        onmouseout="this.style.opacity='0.7'"
                                    >
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11v4m-2-2h4"></path>
                                        </svg>
                                    </button>
                                    <button 
                                        @click="collapseAllFolders()"
                                        class="text-xs px-1.5 py-0.5 rounded transition-all hover:scale-110"
                                        :title="t('sidebar.collapse_all')"
                                        style="opacity: 0.7;"
                                        onmouseover="this.style.opacity='1'"
                                        onmouseout="this.style.opacity='0.7'"
                                    >
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 13h4"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div
                                x-show="treeSelectionMode"
                                data-testid="tree-selection-toolbar"
                                class="flex items-center justify-between gap-2 px-2 py-1 mb-1 rounded"
                                style="background-color: var(--bg-hover);"
                            >
                                <span class="text-xs" style="color: var(--text-secondary);" x-text="t('sidebar.selected_count', { count: selectedTreeItems.length })"></span>
                                <div class="flex items-center gap-1">
                                    <button
                                        data-testid="delete-selected-items"
                                        @click="deleteSelectedTreeItems()"
                                        :disabled="selectedTreeItems.length === 0 || deletingSelectedTreeItems"
                                        class="text-xs px-2 py-1 rounded text-white disabled:opacity-50"
                                        style="background-color: var(--danger-primary, #dc2626);"
                                        x-text="t('sidebar.delete_selected')"
                                    ></button>
                                    <button
                                        @click="toggleTreeSelectionMode()"
                                        class="text-xs px-2 py-1 rounded"
                                        style="color: var(--text-secondary);"
                                        x-text="t('common.cancel')"
                                    ></button>
                                </div>
                            </div>
                            <!-- Root drop zone: only rendered while dragging, so the sidebar has no permanent hint box. -->
                            <div 
                                x-show="draggedItem"
                                class="text-xs px-2 py-1 mb-2 rounded transition-all font-medium text-center"
                                :class="{
                                    'border-2 border-dashed bg-accent-light': draggedItem && dragOverFolder === '',
                                    'border-2 border-dashed': draggedItem && dragOverFolder !== '',
                                    'border-2 border-transparent': !draggedItem
                                }"
                                :style="{
                                    'color': draggedItem ? (dragOverFolder === '' ? 'var(--accent-primary)' : 'var(--text-secondary)') : 'var(--text-tertiary)',
                                    'opacity': draggedItem ? '1' : '0.8',
                                    'border-color': draggedItem && dragOverFolder === '' ? 'var(--accent-primary)' : 'var(--border-secondary)',
                                    'background-color': dragOverFolder === '' ? 'var(--accent-light)' : ''
                                }"
                                @dragover.prevent="if(draggedItem) dragOverFolder = '';"
                                @dragenter.prevent="if(draggedItem) dragOverFolder = '';"
                                @dragleave="if(draggedItem) dragOverFolder = null;"
                                @drop.prevent="if(draggedItem) onFolderDrop('')"
                                style="height: 28px; line-height: 20px; display: flex; align-items: center; justify-content: center;"
                            >
                                <span x-text="t('sidebar.root_folder')"></span>
                            </div>
                        </div>
                        
                        <!-- Folders (rendered recursively for unlimited nesting) -->
                        <template x-for="[folderKey, folder] in Object.entries(folderTree).filter(([k, v]) => k !== '__root__' && (!hideUnderscoreFolders || !v.name.startsWith('_'))).sort((a, b) => getFolderSortComparator()(a[1], b[1]))" :key="folderKey">
                            <div x-html="renderFolderRecursive(folder)"></div>
                        </template>
                        
                        <!-- Root notes and images (no folder) -->
                        <div x-html="renderRootItems()"></div>
                        
                        <!-- Loading state (initial /api/notes still in flight).
                             Static shimmer skeleton — pure CSS, no state. Folder
                             rows are full-width with a square icon; note rows
                             are indented with a smaller icon. Staggered animation
                             delays make the rows pulse out of sync so the column
                             feels alive instead of strobing. The 800ms overlay
                             still appears for big-vault cold loads on top of
                             this — they layer naturally. -->
                        <template x-if="notesLoading && notes.length === 0 && allFolders.length === 0">
                            <div class="px-2 py-2 space-y-1" aria-busy="true" :aria-label="t('sidebar.loading_notes')">
                                <div class="flex items-center gap-2 py-1.5 px-2 animate-pulse">
                                    <div class="h-4 w-4 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 62%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 pl-7 pr-2 animate-pulse" style="animation-delay: .12s;">
                                    <div class="h-3 w-3 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 48%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 pl-7 pr-2 animate-pulse" style="animation-delay: .22s;">
                                    <div class="h-3 w-3 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 70%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 px-2 animate-pulse" style="animation-delay: .32s;">
                                    <div class="h-4 w-4 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 55%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 pl-7 pr-2 animate-pulse" style="animation-delay: .42s;">
                                    <div class="h-3 w-3 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 38%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 pl-7 pr-2 animate-pulse" style="animation-delay: .52s;">
                                    <div class="h-3 w-3 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 80%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 px-2 animate-pulse" style="animation-delay: .62s;">
                                    <div class="h-4 w-4 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 42%; background-color: var(--bg-hover);"></div>
                                </div>
                                <div class="flex items-center gap-2 py-1.5 pl-7 pr-2 animate-pulse" style="animation-delay: .72s;">
                                    <div class="h-3 w-3 rounded shrink-0" style="background-color: var(--bg-hover);"></div>
                                    <div class="h-3 rounded" style="width: 50%; background-color: var(--bg-hover);"></div>
                                </div>
                            </div>
                        </template>

                        <!-- Empty state (load finished, vault genuinely empty) -->
                        <template x-if="!notesLoading && notes.length === 0 && allFolders.length === 0">
                            <div class="px-3 py-4 text-sm text-center" style="color: var(--text-tertiary);">
                                <span x-text="t('sidebar.no_notes_yet')"></span><br>
                                <span x-text="t('sidebar.create_first')"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <!-- END FILES PANEL -->
