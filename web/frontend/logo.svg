<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 8 164 184">
  <defs>
    <linearGradient id="bBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bCap" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Crystal body: vertical hexagon (basalt column cross-section) -->
  <path d="M100 14 L174 58 L174 142 L100 186 L26 142 L26 58 Z" fill="url(#bBody)"/>

  <!-- Faceted top cap -->
  <path d="M100 14 L174 58 L100 96 L26 58 Z" fill="url(#bCap)"/>

  <!-- Left shading half for depth -->
  <path d="M100 96 L26 58 L26 142 L100 186 Z" fill="#000000" opacity="0.14"/>

  <!-- Specular highlight on upper-left facet -->
  <path d="M100 14 L26 58 L100 96 Z" fill="#ffffff" opacity="0.10"/>

  <!-- Central ridge -->
  <line x1="100" y1="96" x2="100" y2="186" stroke="#ffffff" stroke-width="2" opacity="0.22"/>
</svg>
